name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:pkg

  terraform:
    # Real-toolchain proof: emit a sample project's infra and run `tofu fmt` +
    # `tofu validate` on it — the same checks the generated deploy pipeline runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - uses: opentofu/setup-opentofu@v1
      - run: npm ci
      - run: npm run test:integration
